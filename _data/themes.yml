# Research themes listed on the About page
- title: Water governance
  text: Right to water, groundwater, governance and institutions; environment; regulation and privatisation
- title: Sanitation
  text: Right to sanitation, wastewater, manual scavenging and sewage workers; gender
- title: Natural resources
  text: Land; mining, plant genetic resources for food and agriculture; multinational companies
- title: Forests
  text: Governance, biodiversity, energy, forest users' rights and trade
- title: Climate change
  text: Common but differentiated responsibility; Clean Development Mechanism, emissions trading
- title: Biosafety
  text: Biotechnology, in particular agro-biotechnology in the South; precautionary principle; liability regimes
- title: Biodiversity
  text: Access and benefit sharing; equity; farmers' rights; intellectual property rights; traditional knowledge
