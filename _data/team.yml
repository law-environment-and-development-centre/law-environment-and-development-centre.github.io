# The people shown on the About page and the homepage.
# photo: a full URL, or a file in assets/img (e.g. /assets/img/nate.jpg)
# profile: link for the "Read more" button (leave blank to hide the button)
# home: true shows the person in the homepage "Meet the Team" strip

- name: Professor Philippe Cullet
  first: Philippe
  short: Prof. Philippe Cullet
  photo: https://static.wixstatic.com/media/fe513e_07a7e087e2664fbdbd54cce276d6671f~mv2.jpg/v1/fit/w_800,h_800,q_85,enc_auto/fe513e_07a7e087e2664fbdbd54cce276d6671f~mv2.jpg
  home: true
  profile: https://www.soas.ac.uk/about/philippe-cullet
  bio: >-
    Philippe is the Director of the Law, Environment and Development Centre (LEDC).
    He co-convenes the [LLM in Environmental Law and Sustainable Development](https://www.soas.ac.uk/study/find-course/llm-environmental-law-and-sustainable-development)
    and the [MRes in Law](https://www.soas.ac.uk/study/find-course/mres-law). He is
    also the Editor of the Law, Environment and Development Journal
    ([LEAD Journal](https://lead-journal.org/)), a peer-reviewed academic
    journal hosted by the LEDC.

- name: Dr Birsha Ohdedar
  first: Birsha
  short: Dr Birsha Ohdedar
  photo: https://static.wixstatic.com/media/e23131_232a5591841e4619a8425c4d1f2af872~mv2.jpg/v1/fit/w_800,h_800,q_85,enc_auto/e23131_232a5591841e4619a8425c4d1f2af872~mv2.jpg
  home: true
  profile: https://www.soas.ac.uk/about/birsha-ohdedar
  bio: >-
    Birsha is the Deputy Director of the Law, Environment and Development Centre
    (LEDC), and co-convenes the [LLM in Environmental Law and Sustainable Development](https://www.soas.ac.uk/study/find-course/llm-environmental-law-and-sustainable-development).
    He is a Senior Lecturer in Climate Change and Environmental Law, an Editor of
    the [LEAD Journal](https://lead-journal.org/), and co-coordinates the
    SOAS Environmental Justice Clinic.

- name: Dr Nate Palmer
  first: Nate
  short: Dr Nate Palmer
  photo: https://static.wixstatic.com/media/e23131_f0bffd5976784d25a6105979b718d0af~mv2.jpg/v1/fit/w_800,h_800,q_85,enc_auto/e23131_f0bffd5976784d25a6105979b718d0af~mv2.jpg
  home: true
  profile: https://www.soas.ac.uk/about/nate-palmer
  bio: >-
    Nate is the Experiential Learning and Engagement Lead at the LEDC, and is a
    Lecturer in International Environmental Law at SOAS, convening modules including
    International Environmental Law and Alternatives to Sustainable Development:
    Rights of Nature and Harmony with Nature. Nate is also an expert member at
    the UN Harmony with Nature Programme, serves as an assistant editor at the
    [LEAD Journal](https://lead-journal.org/), and co-coordinates the SOAS
    Environmental Justice Clinic.

- name: Professor Martin W. Lau
  first: Martin
  short: Prof. Martin W. Lau
  photo: https://static.wixstatic.com/media/e23131_4813c8eba2a84c4a9c61e5ddc790c87a~mv2.jpg/v1/fit/w_800,h_800,q_85,enc_auto/e23131_4813c8eba2a84c4a9c61e5ddc790c87a~mv2.jpg
  home: false
  profile: https://www.soas.ac.uk/about/martin-lau
  bio: >-
    Martin is Professor of South Asian Law at SOAS. His work covers the laws of
    South Asia, comparative environmental law and Islamic law.
