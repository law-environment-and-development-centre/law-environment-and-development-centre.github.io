# Reports and publications on the Clinical Work page, newest first.
# group: reports (published reports with a PDF) or outputs (project pages and news about other work)
# cover: optional small cover image (the report's own first page), stored in assets/img/reports/
# link_label: what the main link says, e.g. "Read the report (PDF, 6.5 MB)"
# Only add titles, dates and links you can check against the published source.

