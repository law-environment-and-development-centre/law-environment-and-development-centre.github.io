- title: Balancing Environmental Protection, Equity and Economic Development – Reflections from the Practice
    of Sustainable Development Principle in Market-Based Mechanism for GHG Emission Reduction
  name: Dr Chung-Hsien Lee
  status: awarded 2018
  abstract: 'This research endeavours to study the proceeding of balancing and weighing as a form of legal
    reasoning by observing the application of sustainable development principle (hereafter abbreviated
    as SD) in the practice of market-based mechanisms in global GHG emission reduction regime.


    Admittedly, SD possesses three competing elements: Environmental protection, societal Equity, and
    Economic development (hereafter abbreviated as EEE). The performance of SD principle relies thoroughly
    on the balance of these three subsidiary principles or values.


    This research first argues that though the balancing of EEE is eventually determined by political
    process or other de facto authority, it does not necessarily imply this activity is beyond the boundary
    of legal research; quite on the contrary, serving as a form of legal reasoning, the proceeding of
    balancing should first stick to basic legal methods and discoursal rules for legal argument. On the
    face of it, most of these legal methods and discoursal rules are constituted by procedural and formal
    requirements, but what underlying all these facial demands are the assertions of indispensability
    of broad deliberation and in the end pragmatic rationale grounded on consideration to specific regulatory
    circumstance and current condition of the case referred. In other words, the essence of balancing
    is not abstract comparison and unmodifiable rating for competing values. Rather, the mission of legal
    balancing is to generate temporary but concrete decision on prioritization of competing principles
    or values while considering limited human reason and social resources at hand.


    This research then turns to the question about the impact global governance factor creates toward
    balancing activities. From examining how SD being applied in market-based mechanisms such as CDM and
    EU ETS to respond global climate challenge, it is realized how governing architecture impacts the
    proceeding of the balancing and weighing of EEE. To be more specific, at municipal level, most of
    the countries primarize their own economic development, while at international or supranational level,
    equality concern between different states and groups stands out. While global issue like climate change
    demands global consensus and collaboration, the fragmented authorities across different layers of
    climate regime may lead to separated valuating process and eventually disagreement on the result of
    balance of EEE.


    For all these, bearing in mind the essential characteristic of the balancing mentioned above remains
    unchanged in global governance structure, it is believed that the way to harmonize this pluralistic
    understanding of SD does not lie in imposing a top-down universalized standard of SD. In this sense,
    the significance of Paris Agreement and ensuing architecture also do not lie in their binding force,
    if any, but whether they are formulated from the bottom-up, regardless of the North and South, to
    create cooperative base for global governance, only upon which effective climate actions will be possible
    and the balance of EEE at global level can be proceeded. Considering current regulatory circumstance
    and situation, global risk of endangerment or even extinction of whole human being, other species
    and entire ecosystem on the planet constitute global factors that will strongly affect the balancing
    of EEE in the global scale that eventually renders global GHG emission reduction target overriding
    the consideration of regional/ sectoral equity and statal development. By saying that preventing global
    warming is to be the priority as the result of the balancing of EEE, it does not imply that equity
    and development concerns are scarified entirely. Rather, what the balance of SD requires is to improve
    equity and to increase development on the premise of ensuring all human being’s survival and coexistence
    with other species on earth.


    It is hoped that the reflection drawn upon from this research can contribute to better understanding
    of balancing as a form of legal reasoning in the global governance era. In that the balancing EEE
    constitutes pivot of SD, by illustrating the proceeding of balancing this research is hoped to enhance
    the practicability of SD law, which in turns is expected to curb the spread of green neoliberal governmentality
    structure at least in climate field.'
