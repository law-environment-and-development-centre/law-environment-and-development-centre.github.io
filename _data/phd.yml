- title: 'Digitisation and Discrimination: Inequalities in the Creation of and Access to Technology in
    India'
  name: Ms Laya Meriyanda
  status: ongoing project
  abstract: This thesis critically examines the intersection of digitisation and systemic discrimination
    in India, tracing through the historical evolution of technological processes and their embedded biases.
    It argues that the creation, recording, and deployment of digital technologies in India have perpetuated
    existing inequalities rooted in caste, religion, economic background. By exploring the discriminatory
    practices within record-keeping, data collection, and technology creation, this research will study
    whether and how marginalised communities are excluded during the process of digitisation. This research
    will examine how colonial legacies, socio-economic disparities, and contemporary digital advancements
    have shaped access to and participation in technological progress. Drawing on decolonial perspectives,
    critical analyses of the digital divide, and algorithmic discrimination, this study will explore the
    multifaceted nature of technological inequality in India from its historical roots to its current
    manifestations in the digital age. The study will contextualise digitisation within India's colonial
    and post-independence record-keeping systems, reinforced caste hierarchies and religious marginalisation.
    It will then delve into the development of modern technologies, including artificial intelligence
    (AI), where biases are encoded into algorithms due to a lack of diverse representation in design teams
    and datasets. The concept of a digital divide will also be explored, in order to breakdown access
    and control of technological systems. Two case studies will be used to substantively analyse the research
    question. The first examines AI-driven facial recognition systems used by the police force in India
    in order to shed light on digitisation within the public security. This will study systems that may
    be trained on biased data to perpetuate patterns under the guise of objectivity. The second will investigate
    data collection practices concerning wet and dry waste sanitation workers, to study. Automating discriminatory
    practices as well as data collection practises may legitimise surveillance through claims of neutrality.
    This thesis will also scrutinise anti-discrimination measures in technology development; and equitable
    data practices to overcome exclusion.
