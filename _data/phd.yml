- title: 'The Right to Sanitation in India: A Multi-faceted Right in Search of a Comprehensive Framework'
  name: Dr Sujith Koonan
  status: awarded 2018
  abstract: 'India is facing a severe sanitation crisis. Open defecation, violence against women while
    going for open defecation, manual scavenging and early drop out of girl students are some of the critical
    sanitation or related issues in India. Poor sanitation scenario severely affects human dignity, autonomy,
    agency and safe environment. It also affects the realisation of other human rights such as health,
    water and education.


    The legal response to this sanitation crisis has been piecemeal and grossly inadequate. The statutory
    framework is fragmented in nature with a number of laws addressing various aspects of sanitation such
    as laws relating to local self-government institutions, environmental laws and law prohibiting manual
    scavenging. In addition to that, the higher judiciary has interpreted the right to sanitation as a
    part of the fundamental right to life. While the legal framework shows a piecemeal and rudimentary
    approach towards sanitation, ad-hoc policies and programmes have occupied the regulatory and governance
    space. This scenario complicates the legal framework on the right to sanitation with a number of law
    and policy instruments with little coordination between them.


    In this context, this thesis examines the right to sanitation and analyse its contents in the Indian
    context. This thesis carries out the mapping of the existing legal and policy framework related to
    the right to sanitation in India and critically analyse it from the perspective of caste, gender,
    class and environment. This research aims to present a comprehensive conceptual framework for the
    right to sanitation. This is a significant improvement upon the existing framework, which is minimalist
    in nature and excludes many critical issues and aspects.'
  completed: true
- title: Looking Beyond the Canopy – The Influence of International Principles, Actors and Values in Evolving
    Forest Related Law (Case Study China)
  name: Dr Feja Lesniewska
  status: awarded 2015
  abstract: 'International law is increasingly developing and evolving through dynamic interactions between
    multiple actors across multiple levels blurring the boundaries between global and localised processes.
    This phenomenon is particular to forests related law given their multiple values to a broad range
    of actors locally and internationally. Such developments expand international legal research horizons
    beyond the traditional state-centric and institutional canopy.


    To identify the influence that principles, actors and values have on forest related law development
    and implementation processes this research looks beyond the classical international law canopy. By
    examining new conservation and bioenergy initiatives in Yunnan, south-west China. The research employs
    a multi-scale approach that includes collecting data from a range of actors extending from international
    to local actors. It uses qualitative discourse analysis of primary and secondary materials collected
    to identify the dynamics at play between international principles, actors and values involved in each
    case study.


    The research consequently identifies the pathways different actors employ to influence forest related
    law processes. It finds that actors employ certain international principles and values discourse.
    However initial outcomes resulting from policy and regulatory interventions appear to weaken international
    principles and values actors purport to be seeking to embed. This highlights how some partnerships,
    at all levels, between knowledge-based power and political authority, can marginalise some actors
    participation in forest law-making processes thereby perpetuating certain values to the exclusion
    of others.


    These findings are an important contribution to existing scholarship in extending analysis beyond
    the canopy of international law in order to map the pathways that actors adopt to influence forest
    related law at multiple levels. It highlights the use of international principles and values discourse
    in law-making and implementation processes by privileged actors in localised contexts. The conclusions
    provide a basis for future research towards improving regulatory intervention through adopting appropriate
    principles and values based on fair, transparent and informed participation by all actors to embed
    effective and appropriate forest related law globally.'
  completed: true
- title: Accountability for Environmental Damage Arising out of Armed Conflict in International Law
  name: Dr Aïda Tamer-Chammas
  status: awarded 2015
  abstract: 'Wars are part of human life and will always be, unfortunately. The law of armed conflict
    has developed since the mid-nineteenth century to alleviate the suffering of populations trapped into
    conflict. The relatively recent emergence in legal history of the environment concept and environmental
    law, together with scientific advances and development of weapons, has led the international community
    to confront the enduring environmental legacy of armed conflict. Doctrinal debates have centred on
    the adequacy and effectiveness of environmental protection obligations during armed conflict. This
    thesis focuses on State accountability for environmental damage arising out of armed conflict, under
    the current international legal system.


    The analysis centres first on responsibility of States under the international law of armed conflict,
    for damage to the environment and natural resources occurring in times of war, on the one hand, and
    during occupation, on the other. State responsibility under international environmental law for damage
    to the environment in times of armed conflict is then covered, raising the issue of applicability
    of international environmental law treaties during armed conflict and the resulting interaction between
    the norms of the law of armed conflict and international environmental law. Redress and compensation
    for environmental damage related to armed conflict are furthermore examined.


    Having defined the relevant legal framework, the thesis investigates State practice during armed conflict.
    It considers damage to the environment and natural resources in two separate cases, during the war
    between Lebanon and Israel in 2006, and during the occupation of the West Bank and Gaza. Finally,
    the study concludes on the relevance of the legal regimes surveyed for providing a basis for State
    accountability for environmental damage resulting from armed conflict and suggests proposals to reinforce
    the perceived deficiencies of the system.'
  completed: true
- title: 'Taiwan’s Participation in Global Climate Regime: A Non-Party Perspective'
  name: Dr Fu-Lin Cheng
  status: MPhil awarded 2017
  abstract: 'This thesis aims to explore Taiwan''s participation in the global climate regime from the
    perspective of a non-party state. It argues that given the fact that climate change is the common
    concern of humankind and that the operation of the UNFCCC regime will de facto or even de jure affect
    non-party states, the regime should refer to how a non-party state should be treated when the non-party
    state is rejected rather than reluctant to join the regime.


    In an effort to promote this argument, this thesis starts from the analysis that why Taiwan''s case
    is unique in international law and worth studying in chapter 2. Based on the analysis in chapter 2,
    the thesis turns to explore the evolution and development of the global climate regime to show a whole
    picture and some important features of the regime in chapter 3.


    Chapter 4 moves to address the non-party state issue in the global climate regime. It first examines
    non-party issues based on public international law, and then analyses the influences of overlap of
    climate issues in different regimes, including the potential conflict of norms on climate issues inside
    and outside the UNFCCC system, and the difficulties that a non-party state will confront when integrating
    itself into the regime. Chapter 5 provides an empirical study on the making of Taiwan''s laws and
    policies regarding to climate change. It elucidates how a non-party state struggles to interact and
    reconcile its domestic laws and policies with global climate regime.


    Based on the above studies, chapter 6 turns to rethink the possible approaches to encourage the widest
    participation of all countries and prevent the problem of free riders. Chapter 7 concludes that the
    UNFCCC should make itself more flexible to construct a more harmonised and target–oriented global
    climate regime.'
  completed: true
