- title: 'Rethinking Patent Centric Biomedical Innovation: Towards an Alternative Conceptual Framework
    Building'
  name: Dr Hu Yuan Qiong
  status: awarded 2018
  abstract: 'The insertion of intellectual property law in international trade treaties has facilitated
    the global expansion of patent regime, including those concerning biomedical technologies used to
    address health challenges. The increasing number of patents, however, does not translate into sufficient
    responses to health innovation needs in the reality. Patent law doctrine regards inventions has also
    failed to adequately accommodate innovations derived from traditional medical knowledge and practices.


    Considerable critiques have been made on the conflict between the strong proprietary protection and
    the insufficient innovation for health, as well as the pertinent contingency between openness and
    enclosure in patent regime. And yet, the central conceptual and doctrinal paths within patent law
    regime keep evolving regardless of the critiques from outside, and looking at patent as an indispensable
    route to innovation remains the mainstream policy discourse at international and national levels.
    In this context, the legal construction of the notion of innovation through patent law practice has
    provided the material foundation for the law and policy debates related to biomedical research and
    development. At the same time, the technological changes for biomedical research have on another hand
    kept redefining the boundary of patent law.


    The research intends to provide an alternative critique by exploring the co-production of patent law
    doctrines on biomedical inventions through the interplay of science and technologies with law. It
    would look at the role of expertise in the process of this legal construction, the reflection of such
    construction in social political spheres regarding the discourse of biomedical innovation, and to
    discuss the alternative conceptual framework on the issue.'
