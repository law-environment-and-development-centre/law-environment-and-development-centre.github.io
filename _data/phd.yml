- title: Environmental Justice and Antimicrobial Resistance (AMR) Governance in Bangladesh
  name: Ms Labiba Rukhsana
  status: ongoing project
  abstract: 'Antimicrobial Resistance (AMR) has been recognised as a wicked problem, crossing sectors
    and borders, and a major One Health challenge, leading to quadripartite collaboration between health,
    veterinary, agriculture and environmental bodies, but technical solutions and human health remain
    priorities. Widespread misuse and overuse of antimicrobials together with structural barriers, like
    inadequate WASH infrastructure and access to treatment, and environmental stressors, like pollution
    and climate change, drive up resistance in microbes, leading to major health, economic and environmental
    damage with disproportionate impacts on vulnerable groups like women, elderly and those living in
    poverty or with disability.


    Focusing on the capital city of Dhaka and rural communities of the Southern coastal areas in Bangladesh
    for localised insight, this research explores the complex ways AMR and environmental justice are entangled
    within society and ecosystems, primarily through water. Bangladesh is heavily affected by water pollution,
    climate change and other environmental and social challenges which feed into high levels of AMR with
    significant local and global impacts. The One Health paradigm is well entrenched in AMR policy and
    regulatory framework and yet the environmental sector fails to play an effective role and, despite
    notable progress in the WASH sector, there is need for greater sustained and holistic effort to address
    structural inequalities. This research inquires whether and how an environmental justice approach,
    founded on equality, protection of fundamental human rights and greater active participation and capability
    enhancement of affected communities as well as the environmental, agriculture, fisheries, education
    and other sectors, can be utilised to respond to AMR and environmental challenges more effectively.'
