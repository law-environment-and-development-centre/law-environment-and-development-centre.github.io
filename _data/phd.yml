- title: 'Right to Clean and Affordable Energy in Bangladesh: Analyzing the Human Rights and Development
    Interplay'
  name: Dr Sharowat Shamin
  status: awarded 2026
  abstract: The energy sector has been playing a pivotal role in shaping bilateral, multilateral, and
    regional international relations. Energy demand is on a sharp rise in the Global South ever since
    they entered into industrialization, which finally resulted in meeting various competitive development
    indexes in the name of ‘goals’. Bangladesh is a good example of contextualizing this trend in the
    Global South. Energy security while considered as the major precursor to economic growth, security
    of human rights and freedoms remains outstanding. The dominance of fossil fuel over decades is now
    being replaced by the lucrative renewable energy market. However, the country is heavily relying on
    imported technologies and resources (coal, oil, LNGs) which have been used both public and private
    owned power stations. In absence of own resources and/or technology and knowledge, Global South remains
    handicapped to international donors and corporations, which often results in the loss of ultimate
    energy sovereignty. On the other hand, the South is mostly adversely impacted by climate change— extreme
    weather conditions of drought, salinity, loss of land, flood, river erosion, loss of biodiversity
    and many more irreversible damages. This research investigates the country’s reliance on imported
    fossil fuels, the future of renewables and the sustainability of transitional energy. The objective
    of this research is to examine the sustainability of energy security vis-à-vis people’s access to
    clean and affordable energy and its resultant impact on human development. It questions energy security
    through the human rights lens and tests the enforceability of the right to clean and sustainable energy
    in the global South context taking Bangladesh as a case study. In doing so, it will critically analyze
    Bangladesh’s energy laws, policies, climate obligations and compare them with international environmental
    legal principles to see if the national policies can address energy poverty, and ensure energy sovereignty
    and people’s access to clean and affordable energy.
