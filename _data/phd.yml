- title: 'Indian Farmers and Rights Over Biogenetic Resources: Towards Greater Food Sovereignty'
  name: Dr Zainab Lokhandwala
  status: awarded 2023
  abstract: The conservation and sustainable use of biogenetic resources in food and agriculture is a
    foundational step towards achieving food sovereignty. Food sovereignty, as a concept, has evolved
    since its first articulation in 1996 by Via Campesina and has over the years received the support
    of many governments, international and national NGOs, and advocacy groups. As a legal concept, food
    sovereignty has found utterance in many laws and policies across jurisdictions. In India, many aspects
    of food sovereignty have been advocated, yet the Indian state has largely stood in defence of neoliberal
    agricultural policies favouring big farmers while ambivalently treating small and medium scale farmers.
    Several contradictory policy decisions over the years have affected farmers in different ways. These
    reflect little or no commitment towards using food sovereignty as an agricultural policy approach.
    Rights over biogenetic resources, being an integral part of food sovereignty, has seen a shift from
    the hands of farmers to public and private bodies that now control, manage and bear the responsibility
    to conserve these resources. Legally this has been made possible through the introduction of plant
    breeders rights in 2001, in combination with other laws, policies and market developments. The diminishing
    farmers’ control and autonomy over biogenetic resources is a consequence of ‘farmers rights’ being
    framed as discursive rights standing as exceptions to mainstream property rights. This thesis argues
    that farmers ought to be the primary custodians of rights over biogenetic resources. Such rights need
    to be theoretically and practically developed in furtherance of food sovereignty of small and medium
    scale farmers.
  completed: true
- title: 'Water-Related Subsidies and Groundwater Regulation in India: Social and Environmental Dimensions'
  name: Dr Gayathri Naik
  status: awarded 2022
  abstract: The role of groundwater in realising the fundamental right to water and food security of the
    nation is immense as it contributes to half of India's drinking water and irrigation water demands.
    However, the current groundwater legal framework based on the land-water nexus leads to inequitable
    access and allocation by restricting the benefits of groundwater access to landowners. The State interventions
    like water-related subsidies aim to address this inequitable access and allocations and ensure equity
    and inclusiveness in accessing groundwater drinking water supply and necessary inputs like technology
    and credit in groundwater-based irrigation. Nevertheless, factors like land rights, social discrimination,
    economic disparities, political choices, and bureaucratic interventions that influence and determine
    access to subsidies in drinking water and agriculture development schemes widen the inherent inequity
    in groundwater access and affect supply sustainability. Furthermore, the excessive use of subsidies
    and the current land-water nexus has led to groundwater and aquifers' depletion and deterioration,
    threatening the source sustainability and necessitating reconceptualization of our current legal,
    policy and administrative framework to address these ecological impacts of subsidies and groundwater
    extraction. This thesis explores the role of subsidies in equity and inclusiveness in groundwater
    access and allocation and examines the impacts and implication of subsidies on distributive and social
    equity and environmental sustainability in groundwater access and regulation in India. It uses a tripartite
    water justice framework based on distributive, social, and ecological justice and employs a socio-legal
    approach to analyse subsidies' contribution to groundwater access and sustainability. This thesis
    argues for a paradigm shift in groundwater regulation from the current land rights-based, anthropocentric
    water demands focused, curative approach to adopting ecological justice framework in water governance
    to balance human rights and environmental water needs.
  completed: true
- title: 'Beyond Judicial Veto: Public Trust Doctrine, Administrative Decision Making and Implementation
    of Mining Related Laws - A Case Study of Iron Ore Mining in India'
  name: Dr Roopa Madhav
  status: awarded 2021
  abstract: 'This research examines the application of the Public Trust Doctrine in decision making and
    resource allocation by the mining bureaucracy in India. It seeks to provide a normative account of
    the public trust doctrine and argues that modern day public trust doctrine must incorporate elements
    of the principles of equity, establish strong community participation in decision making, along with
    robust environmental accountability. It interrogates whether the doctrine has relevance beyond being
    a judicial veto of administrative action to also be a guiding tool that outlines the limits of administrative
    power in everyday decision making.


    Public Trust Doctrine reconceptualises the state as a trustee of natural resources owing a fiduciary
    obligation to the community and ecology. Its extensive uptake and application in various jurisdictions
    across the world demonstrate its enduring relevance but poses a puzzle for natural resource governance.
    The conceptualisation of the state as a caring and accountable trustee of resources diverges vastly
    from the reality of state being more of an enterprising economic entity. As the crisis of governance
    around iron ore mining in India demonstrates, the counterfactual is true, and administrators operate
    within a complex web of drivers and pressures. Although the doctrine of public trust is invoked by
    the courts regularly, it is yet to be fully examined and understood as a normative concept in Indian
    jurisprudence. The limited scholarship on the doctrine thus far, focused primarily on the judicial
    interpretation, but sheds no light on how the doctrine operates in administrative practice. By examining
    the guidance, it provides for decision making in the context of iron ore mining, this research argues
    for a better understanding of the power of democratisation of the doctrine in reality. In arguing
    for a richer understanding of the doctrine, I suggest that the core content of the public trust doctrine
    is not a static idea and its iterative reinterpretation is possible only through a process of engagement
    with the realities of decision making and a sustained consultation with the beneficiaries of the trust
    resources i.e. the community of people belonging to any nation.'
  completed: true
- title: 'Climate Change and the Human Right to Water in India: Reforming Water Law for the 21st Century'
  name: Dr Birsha Ohdedar
  status: awarded 2019
  abstract: 'Climate change poses new and complex questions on water resources and the realisation of
    the human right to water in India. In the last twenty years, water laws and policies in India have
    seen a number of reforms, however, water scarcity, water pollution, as well as the impacts of flooding
    remain critical issues throughout the country. Accordingly, how local communities and individuals
    adapt to climate change and how such adaptation is built into water law is an important issue.


    Legal scholarship to date has generally utilised a narrow understanding of adaptation and water security
    in its application to water law. Scholarship in India on water law and climate change remains underdeveloped,
    despite the immediacy of the issues. To date much of water law scholarship that has examined climate
    change has focused on climate change as an ontological environmental impact, creating and impacting
    on vulnerability to climate change, rather than looking at how climate change vulnerability can be
    “co-produced” by both meteorological factors and human agency. This can be seen in the Indian context
    through the role of dams and embankment development in flood vulnerability or the political economy
    of irrigation from groundwater in creating water scarcity.


    The aim of this research is to examine the robustness of water law in India to deal with an unpredictable
    climate and deliver the right to water. Through adopting an inter-disciplinary approach, drawing upon
    political ecology, geography and law, this research will help situate legal decisions during “climate
    events” into a social, historical and political contexts. Such contexts will reveal if water laws
    are creating or maintaining vulnerability, thus widening the lens in reforming water law. Such an
    approach will also provide a fresh perspective in rigorously examining the role of power, mediated
    through the law, impinging upon the realisation of the right to water. Case studies will focus on
    particular climate change affected districts in Rajasthan and West Bengal, both of which face issues
    of water scarcity (droughts) and flooding to varying degrees and caused by vastly different climactic
    factors.'
