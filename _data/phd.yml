- title: 'Water Pollution in India: Analysing Rights-Based Litigation'
  name: Dr Lovleen Bhullar
  status: awarded 2018
  abstract: 'Water pollution is a very serious problem in India and the legal framework’s response has
    manifested itself in the form of statutory enactments as well as judicial pronouncements. The higher
    judiciary has developed environmental jurisprudence in order to implement existing legislation, or
    to fill the gaps resulting from the shortcomings or absence of legislation. This has involved the
    broad interpretation of Article 21 of the Constitution of India, which guarantees the fundamental
    right to life, to embed a number of rights, including the right to a clean and healthy environment,
    the right to water, the right to pollution-free water, the right to sanitation and the right to health,
    all of which can contribute towards addressing the problem of water pollution in India (hereinafter
    referred to collectively as ‘environmental rights’). A range of procedural and substantive innovations
    has also facilitated judicial interventions.


    There is a plethora of literature highlighting the expansive interpretation by the higher judiciary
    of Article 21 of the Constitution to include environmental rights. However, there has been limited
    systematic analysis of these environmental rights. The process underpinning the judicial decisions
    where a rights-based approach is invoked by the litigants in the claim formation process and/or by
    the court in the adjudication process in cases alleging water pollution, as well as the outcome, which
    includes the actual implementation of the decisions, their impact as well as effectiveness in contributing
    to social change and addressing the problem of water pollution have also received limited attention.


    This research seeks to fill this knowledge gap by (i) identifying the nature, scope and normative
    content of the environmental rights read into Article 21, to the extent that they are linked with
    water pollution, applying the approach that has heretofore been used for other socio-economic rights;
    (ii) assessing the extent to which the rights-based approach is incorporated, whether explicitly or
    implicitly, into the judicial decision-making process; and (c) assessing the state of implementation
    and impact of judicial decisions and undertaking a preliminary determination of the extent to which
    they succeed in securing social justice.'
