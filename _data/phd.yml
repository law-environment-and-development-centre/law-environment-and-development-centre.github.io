- title: 'Climate Change and Water Security in the Member States of the Gulf Cooperation Council (GCC):
    Governance Challenges in Safeguarding Equity'
  name: Mr Naser Alsayed
  status: ongoing project
  abstract: Water has always been a concern for the inhabitants of the Gulf Cooperation Council (GCC)
    member states. Issues relating to water security in the GCC are linked to cross-cutting, interconnected
    issues of water scarcity, food insecurity, loss of biodiversity, coastal degradation, and demand-based
    water allocation. After the exploration of oil, the population and the economy of the region grew
    considerably. This has increased the stress on the already stressed-induced water resources of the
    region. Due to the advancements of technology and mass wealth accumulated from the exploration of
    oil, GCC governments swiftly met water demand. This was possible through the construction of desalination
    plants and the extraction of groundwater (through fossil aquifers). However, both water resources
    are environmentally damaging, unsustainable, vulnerable, and raise equity issues. Furthermore, climate
    change could adversely impact the regions primary water resources. Across the conduction of two different
    case studies, the thesis examines desalination in the Kingdom of Saudi Arabia (KSA), and the water
    management of the United Arab Emirates (UAE). The primary objective of thesis is to observe the water
    security and equity issues in the GCC region, examine the causes of existing issues, the threat of
    future issues and analyse ways in which certain issues could improve in the future.
