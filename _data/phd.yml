- title: Looking Beyond the Canopy – The Influence of International Principles, Actors and Values in Evolving
    Forest Related Law (Case Study China)
  name: Dr Feja Lesniewska
  status: awarded 2015
  abstract: 'International law is increasingly developing and evolving through dynamic interactions between
    multiple actors across multiple levels blurring the boundaries between global and localised processes.
    This phenomenon is particular to forests related law given their multiple values to a broad range
    of actors locally and internationally. Such developments expand international legal research horizons
    beyond the traditional state-centric and institutional canopy.


    To identify the influence that principles, actors and values have on forest related law development
    and implementation processes this research looks beyond the classical international law canopy. By
    examining new conservation and bioenergy initiatives in Yunnan, south-west China. The research employs
    a multi-scale approach that includes collecting data from a range of actors extending from international
    to local actors. It uses qualitative discourse analysis of primary and secondary materials collected
    to identify the dynamics at play between international principles, actors and values involved in each
    case study.


    The research consequently identifies the pathways different actors employ to influence forest related
    law processes. It finds that actors employ certain international principles and values discourse.
    However initial outcomes resulting from policy and regulatory interventions appear to weaken international
    principles and values actors purport to be seeking to embed. This highlights how some partnerships,
    at all levels, between knowledge-based power and political authority, can marginalise some actors
    participation in forest law-making processes thereby perpetuating certain values to the exclusion
    of others.


    These findings are an important contribution to existing scholarship in extending analysis beyond
    the canopy of international law in order to map the pathways that actors adopt to influence forest
    related law at multiple levels. It highlights the use of international principles and values discourse
    in law-making and implementation processes by privileged actors in localised contexts. The conclusions
    provide a basis for future research towards improving regulatory intervention through adopting appropriate
    principles and values based on fair, transparent and informed participation by all actors to embed
    effective and appropriate forest related law globally.'
