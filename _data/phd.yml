- title: 'Rights of Nature and the Climate Crisis in Bangladesh: The Role of Alternatives to Development'
  name: Mr Mohammad Golam Sarwar
  status: ongoing project
  abstract: 'The growth driven development model along with the anthropocentric regulatory framework is
    considered as the main driver of ecological destruction. While following the footprints of capitalism,
    colonialism and western modernity, developmentalism plays predominant role in pioneering unsustainable
    and extractive economic models which are intrinsically destructive towards environment. Such extractive
    and growth based development models facilitate ecological devastation and accelerate climate crisis
    across the world -where developing countries suffer the most brunt of such ecological crisis.


    Bangladesh, being an emerging developing country, follows capitalist, anthropocentric and extractive
    development model at the cost of ecological overshoot. Such ecological destruction exacerbates the
    climate crisis of a country-which is one of the worst victims of climate crisis.


    The primary aim of this research is to examine the potentials and limitations of rights of nature
    framework as an alternative paradigm to respond the development induced climate crisis. While arguing
    for such alternative paradigm, the research shall highlight the prevalent role of indigenous and local
    values in making the rights of nature framework truly ecocentric.


    The conceptual analysis shall particularly assess the potentials of rights of nature as a paradigm
    shift from growth driven and human centred development approach to ecologically sustainable approach.
    The research shall critically analyse how sustainable development as well as right to development,
    being influenced by anthropocentric regulatory framework, facilitate unsustainable and extractive
    economic development that cause and legitimise ecological destruction and accelerate development induced
    climate crisis. The research shall also explore the role of alternatives to development approaches
    including eco-development, degrowth, buen vivir, ubuntu, radical ecological democracy which offer
    different trajectories for ecocentric reorientation of environmental law that is conducive to promote
    ecological sustainability.


    The research shall critically analyse the context of Bangladesh in order to assess-how development
    policies and environmental regulatory framework influenced and legitimised ecological destruction
    accelerating climate crisis. Such analysis shall indicate the rooms of -why and how- rights of nature
    along with alternatives to development approaches can be utilised to promote ecological sustainability
    while responding to the deepening climate crisis.


    Bangladesh is the central focus of this research, however, the outcome of this research will be relevant
    not just domestically but globally by raising issues that are much more broadly relevant to fight
    against climate injustice.'
