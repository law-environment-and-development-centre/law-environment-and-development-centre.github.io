- title: 'The Right to Sanitation in India: A Multi-faceted Right in Search of a Comprehensive Framework'
  name: Dr Sujith Koonan
  status: awarded 2018
  abstract: 'India is facing a severe sanitation crisis. Open defecation, violence against women while
    going for open defecation, manual scavenging and early drop out of girl students are some of the critical
    sanitation or related issues in India. Poor sanitation scenario severely affects human dignity, autonomy,
    agency and safe environment. It also affects the realisation of other human rights such as health,
    water and education.


    The legal response to this sanitation crisis has been piecemeal and grossly inadequate. The statutory
    framework is fragmented in nature with a number of laws addressing various aspects of sanitation such
    as laws relating to local self-government institutions, environmental laws and law prohibiting manual
    scavenging. In addition to that, the higher judiciary has interpreted the right to sanitation as a
    part of the fundamental right to life. While the legal framework shows a piecemeal and rudimentary
    approach towards sanitation, ad-hoc policies and programmes have occupied the regulatory and governance
    space. This scenario complicates the legal framework on the right to sanitation with a number of law
    and policy instruments with little coordination between them.


    In this context, this thesis examines the right to sanitation and analyse its contents in the Indian
    context. This thesis carries out the mapping of the existing legal and policy framework related to
    the right to sanitation in India and critically analyse it from the perspective of caste, gender,
    class and environment. This research aims to present a comprehensive conceptual framework for the
    right to sanitation. This is a significant improvement upon the existing framework, which is minimalist
    in nature and excludes many critical issues and aspects.'
