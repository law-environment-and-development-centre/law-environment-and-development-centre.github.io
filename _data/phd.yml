- title: 'Animal Law Beyond Universalism and Relativism: A Pluralist Universalist Approach'
  name: Ms Pamoda Jayasundara
  status: ongoing project
  abstract: A close examination of the contemporary normative landscape and legal literature on animal
    protection reflects a growing recognition of the globalised character of its issues and the need for
    corresponding legal responses that transcend the traditional boundaries of domestic, regional and
    international legal systems. While this postnational orientation is being widely acknowledged and
    lauded by scholars, the coherence of animal law discourses and their responsiveness to epistemic diversity
    remains contested. In particular, there is an increasing concern that the attempts to articulate a
    globalised protection for animals are polarised around the universalist-relativist binary and often
    lack measures to meaningfully integrate the plurality of epistemic diversity and culturally-embedded
    perspectives on animal protection. This thesis investigates the conceptual and normative underpinnings
    of animal law discourses across governance levels to examine how its universal discourses engage with
    cultural plurality, and to assess whether and to what extent those discourses continue to manifest
    epistemic hierarchies that disadvantage perspectives situated at the peripheries of its norm-making
    processes. Conversely, the analysis extends to the countervailing risk that uncritical appeals to
    cultural relativism may serve to legitimise severe and systemic harm to animals. Therefore, pluralist
    universalism is explored as an alternative mediatory framework to reconcile the dichotomy between
    moral universalism and cultural relativism in animal law discourses by harnessing a universal moral
    baseline for animal protection while permitting culturally and contextually sensitive legal expressions
    that do not undermine fundamental protections. The inquiry of the existing animal law discourses is
    grounded in Decolonial Theory as the primarily interpretive lens, complemented by insights from adjacent
    and overlapping frameworks with particular focus on Multispecies Justice. A case study of the relational
    human-animal ontologies and practices of the Sri Lankan indigenous people, the Wanniyalaeto, alongside
    comparative examples is employed to demonstrate both the limitations of existing animal discourses
    in engaging with the plurality of culturally situated worldviews on animal protection and the potential
    of pluralist universalism as a normatively robust and institutionally coherent alternative that fosters
    epistemic justice and inclusive global cooperation in animal protection.
