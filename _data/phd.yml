- title: 'Water (In)security and River Governance: A multi-scalar analysis of Differentiated Risk in the
    Teesta Basin, India'
  name: Mr Debarshee Dasgupta
  status: ongoing project
  abstract: 'Water security is one of the most visible and pressing challenges in South Asia — a region
    shaped by some of the largest river systems in the world. The transboundary river basins of South
    Asia are increasingly under stress, where climate-induced risks and uncertainty are coupled with socio-economic
    vulnerability, developmental pressures, and geopolitical rivalries, making water governance an increasingly
    complex endeavour. The discourse on water security, however, is increasingly becoming polarised: one
    emerges from the dominant hydraulic imaginaries and developmental states, and the other is rooted
    in the multiple local realities and historical contexts. The two, however, are not mutually exclusive,
    but rather they co-exist, negotiate, and configure the river basin governance. The thesis examines
    how water-related concerns are articulated, prioritised, and institutionalised across multiple scales
    of governance and how these processes result in the redistribution of water-related risks.


    The research shows how water security is an outcome of socio-political processes that shape the spatial
    and territorial outcome of India’s river water governance. In the process, water-related risks such
    as water scarcity, flooding, ecological degradation, and livelihood challenges get redistributed across
    other sectors and scales that marginalises certain actors and sectors over others. The work deploys
    an in-depth case study of the Indian part of the Teesta River Basin, a key tributary of the Brahmaputra.
    It demonstrates how the Teesta basin comprises multiple scalar contestations that configure the distribution
    of water-related insecurities and risks. The thesis argues that rather than excluding the dominant
    statist perspective, the prevailing governance architecture requires rethinking how state and community
    perspectives can be synergistic to each other by shifting the lens from state-centric water conflict
    and technical fixes in addressing water security and instead underscore the relational aspects of
    the discourse.'
