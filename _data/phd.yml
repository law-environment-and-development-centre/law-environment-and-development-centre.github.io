- title: 'Climate Justice Through Environmental Rights In the GCC Region: A Case Study of the State of
    Qatar Status, Critique and Alternatives'
  name: Dr Sara Almohanadi
  status: awarded 2026
  abstract: In the context of the increasingly urgent issues of climate change facing the world, the aim
    of this thesis is to assess the legal framework required to tackle these issues in the fossil fuel
    dependent countries of the Gulf Co-operation Council (GCC). It will be argued that the legal framework
    constructed to respond to climate change risks should integrate the principles of justice, fairness,
    and equity. The thesis will provide an in-depth evaluation of the inclusivity of decision-making processes
    related to climate change adaptation and mitigation measures, and the extent to which these processes
    achieve distributional justice in balancing the harms and benefits of emissions. By evaluating the
    legal framework through the lens of distributional justice, procedural justice, corrective justice,
    and social justice, this thesis will attempt to provide a conceptual framing for the GCC region to
    draft laws which respond to climate change and address the challenges of transitioning to a low-carbon
    economy.
