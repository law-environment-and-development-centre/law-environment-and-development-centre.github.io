- title: 'Harmony with Nature: Evolving Dimensions of Access to Water in India'
  name: Dr Nate Palmer
  status: awarded 2026
  abstract: This project establishes a unique approach to water governance that is rooted in the ecocentric
    principles of Harmony with Nature. The project will provide a critical analysis of dominant global
    water governance models along with a case study into India and the state of Uttarakhand. These contexts
    will establish the foundation of the second part of the thesis, which focuses on the evolving dimensions
    of water governance from a multiscalar perspective. Importantly, these approaches will need to answer
    the challenges of the anthropocene, specifically the environmental polycrisis. In the context of this
    crisis and the governance models studied, it is clear that a new model must be considered. Here, the
    project relies upon the theoretical framework of Harmony with Nature to establish this new path. Harmony
    with Nature is a term rooted in the recognition that humans, along with everything else in the natural
    world, are interconnected and interdependent. The failure to recognize this has led to many challenges
    for humanity, but the environmental crisis looms the largest. The foundations of this theoretical
    framework are Earth Centered Law, interdisciplinary critical perspectives, and radical localization.
    The recognition of these ecocentric perspectives have led to positive developments in the form of
    Rights of Nature. However, this project will take these principles forward to challenge the governance
    model through confronting private property. This is due to the role that private property plays in
    defining responsibilities to our neighbors, and defining who we even consider our neighbors to be.
    The final part of the project will recompose this relationship between water rights and private property
    and establish Harmony with Nature as a form of perennial governance.
