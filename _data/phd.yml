- title: 'Towards Outer Space Justice: Applying the Lens of Environmental Justice to Reimagine the Outer
    Space Regime'
  name: Ms Bonosree Rani
  status: ongoing project
  abstract: The rapid expansion of space activities, driven by both state and private actors, has intensified
    concerns about justice and sustainability in the outer space regime. These activities, including satellite
    proliferation, space mining, and militarisation, increasingly affect both the outer space ecosystem
    and Earth’s environment. This thesis seeks to reimagine the current outer space regime through the
    lens of environmental justice, expanding its traditional application to address the unequal distribution
    of benefits, burdens, and decision-making power in space governance. Anchored in the concept of outer
    space as a global commons, the thesis interrogates how environmental degradation from space activities
    (e.g., space debris, atmospheric pollution) intersects with broader questions of distributive equity,
    procedural fairness, and recognition justice. Using case studies from the United States, a dominant
    spacefaring power, and Bangladesh, a non-spacefaring, climate-vulnerable nation, the thesis explores
    structural disparities in access, liability, and representation in space governance. It argues for
    a justice-centred approach to outer space law and policy, one that is inclusive, accountable, and
    ecologically informed. Ultimately, the study contributes to the emerging discourse on outer space
    justice, advocating for environmental justice principles as a normative and practical foundation for
    more equitable and sustainable space governance.
