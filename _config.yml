# ------------------------------------------------------------------
# LEDC website settings
# Edit the values below and commit; the site rebuilds in about a minute.
# ------------------------------------------------------------------

title: Law, Environment and Development Centre
short_title: LEDC
description: >-
  The Law, Environment and Development Centre (LEDC) at SOAS University of
  London investigates the dynamic relationships between the fields of law,
  environment and development.

# When ledc.info is pointed here, change url to "https://ledc.info" (see README).
url: "https://soasledc.org"
baseurl: ""
timezone: Europe/London

# Soft launch: keeps search engines from listing the site. Set to false at launch.
hide_from_search: false

# Contact details (used in the footer)
contact:
  institution: SOAS University of London
  address:
    - 10 Thornhaugh Street
    - Russell Square
    - London
    - WC1H 0XG
  email: ledc@soas.ac.uk

# Social links: paste a full URL to show the icon, leave blank to hide it
social:
  linkedin: "https://www.linkedin.com/company/soasledc"
  instagram: ""
  facebook: ""

# SOAS logo shown in the header and footer
logo: https://static.wixstatic.com/media/fe513e_be75e067b95f4a2bb94f2544a7178214~mv2.png

# Events are kept as one file each in the _events folder
collections:
  events:
    output: false
  modules:          # LLM module pages, one file each in _modules
    output: true

defaults:
  - scope:
      type: modules
    values:
      layout: module

markdown: kramdown
kramdown:
  parse_block_html: false

exclude:
  - README.md
  - .gitignore

plugins:
  - jekyll-sitemap   # builds /sitemap.xml for search engines (supported by GitHub Pages)
