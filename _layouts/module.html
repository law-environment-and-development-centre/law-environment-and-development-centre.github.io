---
layout: default
---
<header class="wrap page-head">
  <p class="eyebrow"><a href="{{ '/degree-programmes/' | relative_url }}#modules">Teaching &amp; Study · LLM modules</a></p>
  <h1>{{ page.title }}</h1>
  <ul class="module-meta">
    {% if page.code != "" %}<li>{{ page.code }}</li>{% endif %}
    <li>{{ page.credits }} credits</li>
    {% if page.semester %}<li>Term {{ page.semester }}</li>{% endif %}
  </ul>
</header>
<section class="wrap prose module-body">
  {{ content }}
  <p class="actions"><a class="more" href="{{ '/degree-programmes/' | relative_url }}#modules">All modules</a></p>
</section>
