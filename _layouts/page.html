---
layout: default
---
{% if page.banner %}
<header class="page-banner">
  <img src="{% include src.html src=page.banner %}" alt="">
  <h1>{{ page.title }}</h1>
</header>
{% elsif page.side_image %}
<header class="page-intro wrap">
  <img class="page-intro__img" src="{% include src.html src=page.side_image %}" alt="">
  <div class="page-intro__text">
    <h1>{{ page.title }}</h1>
    {{ page.intro | markdownify }}
  </div>
</header>
{% else %}
<header class="page-title wrap">
  <h1>{{ page.title }}</h1>
</header>
{% endif %}

{{ content }}
