<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if site.hide_from_search %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <title>{% if page.title and page.url != "/" %}{{ page.title }} | {{ site.short_title }}{% else %}{{ site.title }} | SOAS{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/events.js' | relative_url }}" defer></script>
</body>
</html>
