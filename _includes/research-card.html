{%- assign r = include.r -%}
<li class="card">
  <h3>{{ r.title }}</h3>
  {% if r.years != "" %}<p class="card__meta">{{ r.years }}</p>{% endif %}
  {% if r.link != "" or r.website %}
  <p class="card__links">
    {% if r.link != "" %}<a class="more" href="{{ r.link }}">Read more<span class="visually-hidden"> about {{ r.title }}</span></a>{% endif %}
    {% if r.website %}<a class="more" href="{{ r.website }}">Project website<span class="visually-hidden"> for {{ r.title }}</span></a>{% endif %}
  </p>
  {% endif %}
</li>
