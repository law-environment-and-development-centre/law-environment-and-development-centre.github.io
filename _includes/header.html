<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="{{ '/' | relative_url }}">
      <img src="{% include src.html src=site.logo %}" alt="SOAS University of London – {{ site.title }} home">
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle__bars" aria-hidden="true"></span><span class="visually-hidden">Menu</span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul>
        {%- for item in site.data.navigation %}
        <li><a href="{% include src.html src=item.url %}"{% if page.url == item.url %} aria-current="page"{% elsif item.url != "/" and page.url contains item.url %} aria-current="true"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
    {% include social.html %}
  </div>
</header>
