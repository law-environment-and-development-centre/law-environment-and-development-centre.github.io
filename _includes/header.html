<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      <img src="{% include src.html src=site.logo %}" alt="SOAS University of London">
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">
    <label for="nav-toggle" class="nav-toggle-label" aria-label="Open menu"><span></span></label>
    <nav class="site-nav" aria-label="Main">
      <ul>
        {%- for item in site.data.navigation %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
    {% include social.html %}
  </div>
</header>
