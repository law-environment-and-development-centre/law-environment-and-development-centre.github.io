# Temporary: builds the site with GitHub's Jekyll and stores the output on the
# build-preview branch so it can be checked while the site is private.
# Safe to delete once the site is live.
name: Preview build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Push built site to build-preview branch
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          cd _site
          git init -q
          git config user.name "preview-bot"
          git config user.email "preview-bot@users.noreply.github.com"
          git checkout -q -b build-preview
          git add -A
          git commit -q -m "Preview build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-preview
